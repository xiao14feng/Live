<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票功能测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .test-section {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .test-section h2 {
            color: #34495e;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .btn-success {
            background: #27ae60;
        }
        
        .btn-success:hover {
            background: #229954;
        }
        
        .btn-danger {
            background: #e74c3c;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .result {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗳️ 投票功能测试页面</h1>
        
        <!-- 测试1: 保存评委分配 -->
        <div class="test-section">
            <h2>1. 保存评委分配</h2>
            <div class="form-group">
                <label>直播流ID:</label>
                <input type="text" id="stream-id-1" value="test_stream_001" placeholder="例如: test_stream_001">
            </div>
            <div class="grid">
                <div>
                    <label>评委1 用户ID:</label>
                    <input type="text" id="judge1-id" value="judge_001" placeholder="judge_001">
                    <label style="margin-top: 10px;">评委1 姓名:</label>
                    <input type="text" id="judge1-name" value="评委张三" placeholder="评委张三">
                </div>
                <div>
                    <label>评委2 用户ID:</label>
                    <input type="text" id="judge2-id" value="judge_002" placeholder="judge_002">
                    <label style="margin-top: 10px;">评委2 姓名:</label>
                    <input type="text" id="judge2-name" value="评委李四" placeholder="评委李四">
                </div>
                <div>
                    <label>评委3 用户ID:</label>
                    <input type="text" id="judge3-id" value="judge_003" placeholder="judge_003">
                    <label style="margin-top: 10px;">评委3 姓名:</label>
                    <input type="text" id="judge3-name" value="评委王五" placeholder="评委王五">
                </div>
            </div>
            <button onclick="testSaveJudges()" style="margin-top: 15px;">保存评委分配</button>
            <div id="result-1" class="result" style="display: none;"></div>
        </div>
        
        <!-- 测试2: 查询评委分配 -->
        <div class="test-section">
            <h2>2. 查询评委分配</h2>
            <div class="form-group">
                <label>直播流ID:</label>
                <input type="text" id="stream-id-2" value="test_stream_001">
            </div>
            <button onclick="testGetJudges()">查询评委分配</button>
            <div id="result-2" class="result" style="display: none;"></div>
        </div>
        
        <!-- 测试3: 查询投票状态 -->
        <div class="test-section">
            <h2>3. 查询评委投票状态</h2>
            <div class="grid">
                <div class="form-group">
                    <label>直播流ID:</label>
                    <input type="text" id="stream-id-3" value="test_stream_001">
                </div>
                <div class="form-group">
                    <label>用户ID:</label>
                    <input type="text" id="user-id-3" value="judge_001">
                </div>
            </div>
            <button onclick="testGetVoteStatus()">查询投票状态</button>
            <div id="result-3" class="result" style="display: none;"></div>
        </div>
        
        <!-- 测试4: 提交评委投票 -->
        <div class="test-section">
            <h2>4. 提交评委投票</h2>
            <div class="grid">
                <div class="form-group">
                    <label>直播流ID:</label>
                    <input type="text" id="stream-id-4" value="test_stream_001">
                </div>
                <div class="form-group">
                    <label>用户ID:</label>
                    <input type="text" id="user-id-4" value="judge_001">
                </div>
                <div class="form-group">
                    <label>投票方向:</label>
                    <select id="side-4">
                        <option value="left">正方 (left)</option>
                        <option value="right">反方 (right)</option>
                    </select>
                </div>
            </div>
            <button class="btn-success" onclick="testSubmitVote()">提交投票</button>
            <div id="result-4" class="result" style="display: none;"></div>
        </div>
        
        <!-- 测试5: 查询投票记录 -->
        <div class="test-section">
            <h2>5. 查询评委投票记录</h2>
            <div class="form-group">
                <label>直播流ID:</label>
                <input type="text" id="stream-id-5" value="test_stream_001">
            </div>
            <button onclick="testGetVoteRecords()">查询投票记录</button>
            <div id="result-5" class="result" style="display: none;"></div>
        </div>
        
        <!-- 测试6: 查询投票汇总 -->
        <div class="test-section">
            <h2>6. 查询投票汇总</h2>
            <div class="form-group">
                <label>直播流ID:</label>
                <input type="text" id="stream-id-6" value="test_stream_001">
            </div>
            <button onclick="testGetVoteSummary()">查询投票汇总</button>
            <div id="result-6" class="result" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        const BASE_URL = 'https://determined-ambition-production-a3c3.up.railway.app/api';
        
        function showResult(elementId, data, success = true) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            el.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            el.style.borderLeft = success ? '4px solid #27ae60' : '4px solid #e74c3c';
        }
        
        async function testSaveJudges() {
            const streamId = document.getElementById('stream-id-1').value;
            const data = {
                stream_id: streamId,
                judges: [
                    {
                        slot: 1,
                        userId: document.getElementById('judge1-id').value,
                        name: document.getElementById('judge1-name').value,
                        avatar: '/static/avatar1.png',
                        role: 'judge',
                        votes: 0
                    },
                    {
                        slot: 2,
                        userId: document.getElementById('judge2-id').value,
                        name: document.getElementById('judge2-name').value,
                        avatar: '/static/avatar2.png',
                        role: 'judge',
                        votes: 0
                    },
                    {
                        slot: 3,
                        userId: document.getElementById('judge3-id').value,
                        name: document.getElementById('judge3-name').value,
                        avatar: '/static/avatar3.png',
                        role: 'judge',
                        votes: 0
                    }
                ]
            };
            
            try {
                const response = await fetch(`${BASE_URL}/v1/admin/judges`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showResult('result-1', result, response.ok);
            } catch (error) {
                showResult('result-1', { error: error.message }, false);
            }
        }
        
        async function testGetJudges() {
            const streamId = document.getElementById('stream-id-2').value;
            try {
                const response = await fetch(`${BASE_URL}/v1/admin/judges?stream_id=${streamId}`);
                const result = await response.json();
                showResult('result-2', result, response.ok);
            } catch (error) {
                showResult('result-2', { error: error.message }, false);
            }
        }
        
        async function testGetVoteStatus() {
            const streamId = document.getElementById('stream-id-3').value;
            const userId = document.getElementById('user-id-3').value;
            try {
                const response = await fetch(`${BASE_URL}/v1/judge-vote/status?stream_id=${streamId}&user_id=${userId}`);
                const result = await response.json();
                showResult('result-3', result, response.ok);
            } catch (error) {
                showResult('result-3', { error: error.message }, false);
            }
        }
        
        async function testSubmitVote() {
            const streamId = document.getElementById('stream-id-4').value;
            const userId = document.getElementById('user-id-4').value;
            const side = document.getElementById('side-4').value;
            
            const data = {
                stream_id: streamId,
                user_id: userId,
                side: side
            };
            
            try {
                const response = await fetch(`${BASE_URL}/v1/judge-vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showResult('result-4', result, response.ok);
            } catch (error) {
                showResult('result-4', { error: error.message }, false);
            }
        }
        
        async function testGetVoteRecords() {
            const streamId = document.getElementById('stream-id-5').value;
            try {
                const response = await fetch(`${BASE_URL}/v1/admin/judge-votes?stream_id=${streamId}`);
                const result = await response.json();
                showResult('result-5', result, response.ok);
            } catch (error) {
                showResult('result-5', { error: error.message }, false);
            }
        }
        
        async function testGetVoteSummary() {
            const streamId = document.getElementById('stream-id-6').value;
            try {
                const response = await fetch(`${BASE_URL}/votes?stream_id=${streamId}`);
                const result = await response.json();
                showResult('result-6', result, response.ok);
            } catch (error) {
                showResult('result-6', { error: error.message }, false);
            }
        }
    </script>
</body>
</html>
